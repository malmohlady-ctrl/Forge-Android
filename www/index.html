<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Forge</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; box-sizing: border-box; }
  body { background: #141b2e; color: #f5eeda; font-family: system-ui, sans-serif;
         min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 18px; padding: 24px; text-align: center; }
  img.logo { width: 148px; height: 148px; }
  h1 { font-size: 15px; letter-spacing: .42em; font-weight: 800; color: #f5eeda; }
  .sub { color: #d4a72c; font-size: 12px; letter-spacing: .18em; font-weight: 700; }
  p.note { color: #a8b4d4; font-size: 13.5px; line-height: 1.55; max-width: 300px; }
  .pill { border: 1px solid #2c3a5e; background: #1c2742; color: #a8b4d4;
          padding: 6px 12px; border-radius: 999px; font-size: 12px; }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="The Forge logo">
  <h1>THE FORGE</h1>
  <div class="sub">ANDROID · PROOF OF CONCEPT</div>
  <p class="note">M0 shell — branding, offline start, native container. The full Forge arrives in later milestones.</p>
  <div class="pill" id="stamp">Rendered locally · no network needed</div>
</body>
</html>
